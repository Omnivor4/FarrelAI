<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#222225">
  <title>Farrel - Admin Dashboard</title>
  <link rel="icon" type="image/png" href="/assets/images/farrel-avatar.png">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body class="admin-body">
  <header class="admin-header">
    <div class="admin-brand">
      <img src="/assets/images/farrel-avatar.png" alt="Farrel" class="brand-avatar">
      <span class="brand-name">Farrel</span>
      <span class="admin-badge">Admin Dashboard</span>
    </div>

    <div class="admin-nav-actions">
      <a href="/" class="btn-secondary">&larr; Kembali ke Chat</a>
      <button type="button" class="btn-secondary" id="logoutBtn">Keluar</button>
    </div>
  </header>

  <main class="login-gate-container" id="loginGate">
    <div class="login-card">
      <h2>Akses Dasbor Admin</h2>
      <p>Masukkan password admin untuk melihat data aktivitas chat dan daftar perangkat.</p>
      
      <input 
        type="password" 
        id="adminKeyInput" 
        class="login-input" 
        placeholder="Password Admin (Default: farrel123)"
        autocomplete="current-password"
      >
      
      <button type="button" id="loginBtn" class="login-btn">Masuk ke Dasbor</button>
      <div id="loginError" class="login-error"></div>
    </div>
  </main>

  <main class="dashboard-container" id="dashboardContainer">
    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Perangkat Unik</div>
        <div class="stat-value" id="totalDevices">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Pesan Chat</div>
        <div class="stat-value" id="totalMessages">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Aksi Cepat</div>
        <div style="display: flex; gap: 8px; margin-top: 4px;">
          <button type="button" class="btn-secondary" id="refreshBtn">Refresh</button>
          <button type="button" class="btn-primary" id="exportBtn">Unduh .TXT Log</button>
        </div>
      </div>
    </section>

    <section class="dashboard-grid">
      <div class="panel-card">
        <div class="panel-header">
          <span class="panel-title">Perangkat yang Mencoba</span>
        </div>
        <ul class="device-list" id="deviceList">
          <li class="empty-state">Memuat perangkat...</li>
        </ul>
      </div>

      <div class="panel-card">
        <div class="panel-header">
          <span class="panel-title">Riwayat Percakapan</span>
        </div>

        <div class="chat-feed-controls">
          <input 
            type="text" 
            id="searchInput" 
            class="search-input" 
            placeholder="Cari kata kunci dalam chat..."
          >
        </div>

        <div class="logs-feed-list" id="logsFeedList">
          <div class="empty-state">Memuat percakapan...</div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/assets/js/admin.js"></script>
</body>
</html>
